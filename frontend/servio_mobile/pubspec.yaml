name: servio_mobile
description: "Servio mobile app for waiters: tables, orders and payments."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  webview_flutter: ^4.14.1
  shared_preferences: ^2.5.6
  servio_shared:
    path: ../servio_shared
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true
