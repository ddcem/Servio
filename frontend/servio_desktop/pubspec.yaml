name: servio_desktop
description: "Servio desktop app: kitchen and bar displays and the admin panel."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  fl_chart: ^1.2.0
  file_selector: ^1.1.0
  printing: ^5.15.1
  intl: ^0.20.3
  servio_shared:
    path: ../servio_shared

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true
